<!-- Error surfacing: capta errores reales en lugar de "Script error." genérico -->
<script>
window.addEventListener('error', function(e){
  var msg = (e && (e.message || e.error && e.error.message)) || 'Error desconocido';
  var src = (e && e.filename ? ' @ ' + e.filename + ':' + (e.lineno||'') : '');
  console.warn('[Bloom ERR]', msg, src, e && e.error && e.error.stack);
  var el = document.getElementById('bloom-err');
  if (!el) {
    el = document.createElement('div');
    el.id = 'bloom-err';
    el.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;background:#2A0F0F;color:#FFB3B3;border:1px solid #7A2020;padding:10px 14px;border-radius:6px;font:12px/1.4 monospace;max-height:40vh;overflow:auto;white-space:pre-wrap;';
    document.body.appendChild(el);
  }
  el.textContent = '⚠ ' + msg + src + '\n' + (e && e.error && e.error.stack ? e.error.stack : '');
});
window.addEventListener('unhandledrejection', function(e){
  console.warn('[Bloom PROMISE ERR]', e.reason);
});
</script>

const getToday = () => {
  const d = new Date();
  const months = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
  return `${String(d.getDate()).padStart(2, '0')} DE ${months[d.getMonth()]} DE ${d.getFullYear()}`;
};
const fmtCOP = n => {
  if (!n && n !== 0) return '—';
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    minimumFractionDigits: 0
  }).format(Math.round(n));
};
const fmtCOPShort = n => {
  if (!n && n !== 0) return '—';
  return '$' + new Intl.NumberFormat('es-CO', {
    minimumFractionDigits: 0
  }).format(Math.round(n));
};

  oro: 'PREMIUM',
  plata: 'ADVANCED',

// ── Número de cotización ──────────────────────────────────────────────────────
const QUOTE_COUNTER_KEY = 'bloom_quote_counter';
const MONTHS_MAP = {
  'ENERO': '01',
  'FEBRERO': '02',
  'MARZO': '03',
  'ABRIL': '04',
  'MAYO': '05',
  'JUNIO': '06',
  'JULIO': '07',
  'AGOSTO': '08',
  'SEPTIEMBRE': '09',
  'OCTUBRE': '10',
  'NOVIEMBRE': '11',
  'DICIEMBRE': '12'
};
const genQuoteNumber = (clientName, dateStr) => {
  const counter = parseInt(localStorage.getItem(QUOTE_COUNTER_KEY) || '0') + 1;
  localStorage.setItem(QUOTE_COUNTER_KEY, String(counter));
  // Nombre: sin tildes, sin espacios, max 12 chars
  const name = (clientName || 'CLIENTE').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '').substring(0, 12).toUpperCase();
  // Fecha DDMMYY desde "17 DE ABRIL DE 2026"
  const parts = (dateStr || '').toUpperCase().split(' DE ');
  const dd = (parts[0] || '01').padStart(2, '0');
  const mm = MONTHS_MAP[parts[1]] || '01';
  const yy = (parts[2] || new Date().getFullYear().toString()).slice(-2);
  return `${name}_${dd}${mm}${yy}_${String(counter).padStart(3, '0')}`;
};

// ── Helpers para ajuste de cantidades ─────────────────────────────────────────
const isNum = v => v !== '' && v !== null && v !== undefined && !isNaN(parseFloat(String(v))) && String(v).trim() !== '' && String(v).trim() !== '✔' && String(v).trim() !== 'NA';
const rowDelta = (row, tier) => {
  const origKey = 'orig' + tier.charAt(0).toUpperCase() + tier.slice(1); // origOro, origPlata, origBronce
  if (!isNum(row[tier]) || !isNum(row[origKey])) return 0;
  return (parseFloat(row[tier]) - parseFloat(row[origKey])) * (row.unitPrice || 0);
};
const calcTierAdds = tableRows => {
  const rows = (tableRows || []).filter(r => !r.deleted);
  return {
    oro: rows.reduce((s, r) => s + (r.isCustom ? r.oroPrice || 0 : rowDelta(r, 'oro')), 0),
    plata: rows.reduce((s, r) => s + (r.isCustom ? r.plataPrice || 0 : rowDelta(r, 'plata')), 0),
    bronce: rows.reduce((s, r) => s + (r.isCustom ? r.broncePrice || 0 : rowDelta(r, 'bronce')), 0),
    clean: rows.reduce((s, r) => s + (r.isCustom ? r.cleanPrice || 0 : rowDelta(r, 'clean')), 0)
  };
};
