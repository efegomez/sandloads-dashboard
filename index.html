<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandloads Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:1.25rem}
.dash{background:#111318;border-radius:12px;padding:1.25rem;max-width:1000px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;gap:8px;flex-wrap:wrap}
.dash-title{font-size:18px;font-weight:500;color:#fff;letter-spacing:.2px}
.dash-sub{font-size:11px;color:#444;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1.25rem}
.stat{background:#222428;border-radius:8px;padding:10px 14px;border:0.5px solid #2e3035}
.stat-lbl{font-size:11px;color:#888;margin-bottom:2px}
.stat-val{font-size:22px;font-weight:500;color:#00E676}
.stat-sub{font-size:11px;font-weight:500;margin-top:3px}
.refbtn{font-size:12px;padding:5px 14px;border-radius:8px;border:0.5px solid #2a2a2a;background:#1a1c20;color:#555;cursor:pointer;transition:all .15s}
.refbtn:hover{color:#00E676;border-color:#00E676}
.section-lbl{font-size:11px;font-weight:500;padding:6px 0 5px;border-bottom:0.5px solid #1e2024;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.slbl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.t-row{display:flex;align-items:center;height:42px;margin-bottom:2px;border-radius:8px;overflow:hidden}
.t-row.row-done{background:#0a1f12}
.t-row.row-done-crane{background:#1c1e22}
.t-row.row-done-vista{background:#1e1600}
.t-row.row-done-borland{background:#0d1a2e}
.t-row.row-done-jk{background:#2a2205}
.t-row.row-done-lamesa{background:#2a0e0d}
.t-row.row-active{background:#151a17}
.t-row.row-active-crane{background:#18191d}
.t-row.row-vista{background:#1c1800}
.t-row.row-borland{background:#0a1520}
.t-row.row-jk{background:#241d05}
.t-row.row-lamesa{background:#230d0c}
.t-row.row-done-bss{background:#0d2a30}
.t-row.row-bss{background:#0a2328}
.t-row.row-done-ussc{background:#301708}
.t-row.row-ussc{background:#2a1409}
.t-row.row-done-vistacrane{background:#251238}
.t-row.row-vistacrane{background:#1f1030}
.t-row.row-pending{opacity:.45}
.t-row.row-no-show{background:#1f0a12}
.t-row.row-broken{background:#1f0a12}
.t-accent{width:3px;height:100%;flex-shrink:0}
.t-name{width:120px;flex-shrink:0;padding:0 8px 0 9px}
.t-dname{font-size:13px;font-weight:500;color:#e8e8e8}
.t-dname.no-show{color:#FF4081}
.t-dname.broken{color:#FF4081}
.t-hour{font-size:10px;font-weight:500;margin-top:1px}
.t-count{width:32px;flex-shrink:0;text-align:center;font-size:12px;font-weight:600;line-height:1.2}
.t-bar{flex:1;position:relative;height:42px;min-width:0}
.t-bubble{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;cursor:default;border:1.5px solid;transition:transform .12s}
.t-bubble:hover{transform:translateY(-50%) scale(1.2);z-index:5}
.t-badge{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;padding:1px 7px;border-radius:8px;font-weight:500;white-space:nowrap;border:0.5px solid}
.pb-badge{background:#0a1f12;color:#00E676;border-color:#00a152}
.crane-badge{background:#1c1e22;color:#9aa0a8;border-color:#4a5058}
.vista-badge{background:#1e1500;color:#EF9F27;border-color:#a06800}
.borland-badge{background:#0d1a2e;color:#4FC3F7;border-color:#0277bd}
.jk-badge{background:#2a2205;color:#FFD54F;border-color:#B38F00}
.lamesa-badge{background:#2a0e0d;color:#E53935;border-color:#8C1D1B}
.bss-badge{background:#0a2328;color:#26C6DA;border-color:#00838F}
.ussc-badge{background:#2a1409;color:#FF7043;border-color:#BF360C}
.vistacrane-badge{background:#1f1030;color:#B388FF;border-color:#6A1B9A}
.noshow-badge{background:#1f0a12;color:#FF4081;border-color:#b5004c}
.broken-badge{background:#1f0a12;color:#FF4081;border-color:#b5004c}
.tick-wrap{display:flex;height:18px;margin-bottom:3px}
.tick-spc{width:123px;flex-shrink:0}
.tick-bar-t{flex:1;position:relative}
.tick-line{position:absolute;top:0;height:100%;border-left:0.5px solid #1e2024}
.tick-lbl{position:absolute;top:2px;font-size:9px;color:#666;transform:translateX(-50%);white-space:nowrap}
.info-msg{color:#9aa0a8;font-size:11px;padding:8px 12px;background:#1a1c20;border-radius:8px;border:0.5px solid #2e3035;margin-bottom:1rem}
</style>
</head>
<body>
<div class="dash">
  <div class="topbar">
    <div>
      <div class="dash-title" id="dash-title">Sandloads</div>
      <div class="dash-sub" id="upd">Cargando...</div>
    </div>
    <button class="refbtn" onclick="loadData()">Refrescar</button>
  </div>
  <div id="msg-box"></div>
  <div class="stats" id="stats"></div>
  <div id="timeline"></div>
</div>

<script>
const SHEET_ID  = "1FlPvLr6eHExUb14CqPtPTUQmlHgUokIjLHFsidWzk-Y";
const API_KEY   = "AIzaSyD-Covr3yS71XCCCf-kOMP6_GNqi4yXyGU"; // restringida: HTTP referrer github.io + Sheets API only
const REFRESH_MS = 5 * 60 * 1000;

const PB     = {accent:"#00E676", dim:"#00a152", badgeCls:"pb-badge"};
const CRANE  = {accent:"#9aa0a8", dim:"#4a5058", badgeCls:"crane-badge"};
const VISTA   = {accent:"#EF9F27", dim:"#a06800", badgeCls:"vista-badge"};
const BORLAND = {accent:"#4FC3F7", dim:"#0277bd", badgeCls:"borland-badge"};
const JK     = {accent:"#FFD54F", dim:"#B38F00", badgeCls:"jk-badge"};
const LAMESA = {accent:"#E53935", dim:"#8C1D1B", badgeCls:"lamesa-badge"};
const BSS    = {accent:"#26C6DA", dim:"#00838F", badgeCls:"bss-badge"};
const USSC   = {accent:"#FF7043", dim:"#BF360C", badgeCls:"ussc-badge"};
const VISTACRANE = {accent:"#B388FF", dim:"#6A1B9A", badgeCls:"vistacrane-badge"};
const NOSHOW = {accent:"#FF4081", dim:"#b5004c", badgeCls:"noshow-badge"};
const BROKEN = {accent:"#FF4081", dim:"#b5004c", badgeCls:"broken-badge"};

function isBroken(d){return d.status==="ROTO"||d.status==="REPAIRING";}
function isNoShow(d){return d.status==="no contesta";}
function isIdle(d){return d.status==="pendiente";}
function palette(d){
  if(isBroken(d)) return BROKEN;
  if(isNoShow(d)) return NOSHOW;
  // Pendiente ya NO fuerza gris genérico — conserva el color de su mina,
  // rowClass le agrega "row-pending" para atenuarlo (ver isIdle abajo).
  if(d.type==="CRANE")   return CRANE;
  if(d.type==="VISTA")   return VISTA;
  if(d.type==="BORLAND") return BORLAND;
  if(d.type==="JK")      return JK;
  if(d.type==="LAMESA")  return LAMESA;
  if(d.type==="BSS")     return BSS;
  if(d.type==="USSC")    return USSC;
  if(d.type==="VISTACRANE") return VISTACRANE;
  return PB;
}
function rowClass(d){
  if(d.photos>=d.qty&&d.qty>0){
    if(d.type==="CRANE")   return "row-done-crane";
    if(d.type==="VISTA")   return "row-done-vista";
    if(d.type==="BORLAND") return "row-done-borland";
    if(d.type==="JK")      return "row-done-jk";
    if(d.type==="LAMESA")  return "row-done-lamesa";
    if(d.type==="BSS")     return "row-done-bss";
    if(d.type==="USSC")    return "row-done-ussc";
    if(d.type==="VISTACRANE") return "row-done-vistacrane";
    return "row-done";
  }
  if(isBroken(d)) return "row-broken";
  if(isNoShow(d)) return "row-no-show";

  let base;
  if(d.type==="CRANE")        base="row-active-crane";
  else if(d.type==="VISTA")   base="row-vista";
  else if(d.type==="BORLAND") base="row-borland";
  else if(d.type==="JK")      base="row-jk";
  else if(d.type==="LAMESA")  base="row-lamesa";
  else if(d.type==="BSS")     base="row-bss";
  else if(d.type==="USSC")    base="row-ussc";
  else if(d.type==="VISTACRANE") base="row-vistacrane";
  else                        base="row-active";

  return isIdle(d) ? base+" row-pending" : base;
}
function nameClass(d){
  if(isBroken(d)) return "t-dname broken";
  if(isNoShow(d)) return "t-dname no-show";
  return "t-dname";
}
function fmtH(h){return h===0?"12am":h<12?h+"am":h===12?"12pm":(h-12)+"pm";}
const MIN_H=0,MAX_H=20;
function pct(h){return((h-MIN_H)/(MAX_H-MIN_H)*100).toFixed(2);}

// Fallback: datos de muestra
const SAMPLE=[
  {name:"Pedro",    truck:"2026",startH:0, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Yanquiel", truck:"122", startH:0, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Miguel",   truck:"959", startH:0, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Jesus",    truck:"0385",startH:0, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Doanys",   truck:"804", startH:5, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Yasiel",   truck:"960", startH:5, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Felix",    truck:"24",  startH:11,qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Santiago", truck:"961", startH:5, qty:5,photos:0,status:"ACTIVO",type:"PB"},
  {name:"Leandro",  truck:"206", startH:4, qty:5,photos:0,status:"ACTIVO",type:"CRANE"},
  {name:"Juan",     truck:"T27", startH:15,qty:5,photos:0,status:"ACTIVO",type:"VISTA"},
];

function parseRows(rows){
  const STATUS_NORM={
    "activo":"ACTIVO","active":"ACTIVO","done":"DONE",
    "roto":"ROTO","broken":"ROTO","repairing":"REPAIRING",
    "no contesta":"no contesta","no answer":"no contesta","n/c":"no contesta",
    "pendiente":"pendiente","pending":"pendiente",
  };

  if(!rows.length) return [];

  // Columnas localizadas por el texto del encabezado (fila 0), no por
  // posición relativa adivinada. El sheet ha cambiado de formato dos veces
  // en un mes (separador "to" -> guión, y una columna en blanco nueva entre
  // RUTA y Qty) — anclar a los headers hace que un cambio de columnas no
  // vuelva a tumbar el parser entero.
  const header=rows[0]||[];
  const col=(re)=>header.findIndex(h=>re.test((h||"").trim()));
  const nameIdx  = col(/driver.*name/i);
  const truckIdx = col(/truck/i);
  const rutaIdx  = col(/^ruta$/i);
  const qtyIdx   = col(/qty/i);
  const statusIdx= col(/status/i);
  const photoIdx = col(/photo/i);
  if(nameIdx<0 || rutaIdx<0) return [];

  // Una fila cuenta como carga activa si la celda RUTA trae a la vez una
  // mina reconocida y una hora (o "now") — sin importar si el separador es
  // "to", guión, o nada. Esto también filtra notas sueltas de la misma
  // columna (roto, no sale, teléfonos, "quiere crane", etc.) que no traen
  // ambas cosas juntas.
  const MINA_RE=/vista-?\s*crane|crane|borland|vista|prefill|\bjk\b|lamesa|\bbss\b|\bussc\b/i;
  const HOUR_RE=/\d{1,2}\s*(am|pm)|\bnow\b/i;

  const drivers=[];
  for(let i=1;i<rows.length;i++){
    const cells=rows[i];
    if(!cells||!cells.length) continue;

    const ruta=(cells[rutaIdx]||"").trim();
    if(!MINA_RE.test(ruta) || !HOUR_RE.test(ruta)) continue;

    const nameFull=(cells[nameIdx]||"").trim();
    if(!nameFull || /^\d/.test(nameFull)) continue;
    const truck=(truckIdx>=0?cells[truckIdx]:"")||"";

    const type=/vista-?\s*crane/i.test(ruta)?"VISTACRANE"
      :/crane/i.test(ruta)?"CRANE"
      :/borland/i.test(ruta)?"BORLAND"
      :/vista|prefill/i.test(ruta)?"VISTA"
      :/\bjk\b/i.test(ruta)?"JK"
      :/lamesa/i.test(ruta)?"LAMESA"
      :/\bbss\b/i.test(ruta)?"BSS"
      :/\bussc\b/i.test(ruta)?"USSC"
      :"PB";

    const qty=parseInt((qtyIdx>=0?cells[qtyIdx]:"")||"")||5;
    const stRaw=((statusIdx>=0?cells[statusIdx]:"")||"").toLowerCase().trim();
    const status=STATUS_NORM[stRaw]||(stRaw?"ACTIVO":"pendiente");
    const photos=(photoIdx>=0?cells.slice(photoIdx):[]).filter(v=>/^\d{6,}$/.test((v||"").trim())).length;

    const hm=ruta.match(/(\d{1,2})\s*(am|pm)/i);
    let startH=0;
    const isNow=!hm && /\bnow\b/i.test(ruta);
    if(hm){
      let h=parseInt(hm[1]);
      const ap=hm[2].toLowerCase();
      if(ap==="pm"&&h!==12) h+=12;
      if(ap==="am"&&h===12) h=0;
      startH=h;
    }

    drivers.push({name:nameFull.split(/\s+/)[0],truck:truck.trim(),startH,qty,photos,status,type,ruta,isNow});
  }

  // Las rutas "Now" (sin hora programada) se ubican a continuación de la
  // última hora real del día, para que queden al final del timeline.
  const realHours=drivers.filter(d=>!d.isNow).map(d=>d.startH);
  const lastH=realHours.length?Math.max(...realHours):0;
  drivers.filter(d=>d.isNow).forEach(d=>{ d.startH=Math.min(MAX_H,lastH+1); });
  return drivers;
}

async function fetchAllRows(){
  const now=new Date();
  const tabName=String(now.getMonth()+1).padStart(2,'0')+"."+String(now.getDate()).padStart(2,'0');
  // Single-quotes required by Sheets API for tab names containing dots
  const range=encodeURIComponent("'"+tabName+"'");

  const res=await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}&_=${Date.now()}`,
    {referrerPolicy:"unsafe-url"}
  );
  const json=await res.json();
  if(json.error) throw new Error(json.error.message);
  return json.values||[];
}

async function loadData(){
  const now=new Date();
  const tabName=String(now.getMonth()+1).padStart(2,'0')+"."+String(now.getDate()).padStart(2,'0');
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  document.getElementById("dash-title").textContent="Sandloads — "+now.getDate()+" "+meses[now.getMonth()]+" "+now.getFullYear();
  document.getElementById("upd").textContent="Actualizando...";
  document.getElementById("msg-box").innerHTML="";
  try{
    const rows=await fetchAllRows();
    const drivers=parseRows(rows);
    if(drivers.length===0){
      document.getElementById("msg-box").innerHTML=
        `<div class="info-msg">Pestaña "${tabName}" sin choferes — mostrando datos de sesión.</div>`;
      render(SAMPLE);
    } else {
      render(drivers);
    }
  }catch(e){
    const msg=e.message.includes("permission")||e.message.includes("parse")
      ?`Pestaña "${tabName}" no encontrada en el sheet — crea la pestaña para ver datos de hoy.`
      :e.message;
    document.getElementById("msg-box").innerHTML=`<div class="info-msg">${msg}</div>`;
    render(SAMPLE);
  }
  document.getElementById("upd").textContent=
    "Actualizado: "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
}

const TYPE_META={
  PB:        {accent:"#00E676", label:"PB"},
  JK:        {accent:"#FFD54F", label:"JK"},
  CRANE:     {accent:"#9aa0a8", label:"Crane"},
  VISTA:     {accent:"#EF9F27", label:"Vista"},
  BORLAND:   {accent:"#4FC3F7", label:"Borland"},
  LAMESA:    {accent:"#E53935", label:"Lamesa"},
  BSS:       {accent:"#26C6DA", label:"BSS"},
  USSC:      {accent:"#FF7043", label:"USSC"},
  VISTACRANE:{accent:"#B388FF", label:"Vista-Crane"},
};

function render(DRIVERS){
  // Orden de las secciones = orden en que aparecen las minas en el excel
  // (fila por fila, de arriba a abajo), no un orden fijo en el código.
  // Así, si mañana cambian el orden de los bloques en el sheet, el
  // dashboard lo refleja solo.
  const seenTypes=[];
  DRIVERS.forEach(d=>{ if(!seenTypes.includes(d.type)) seenTypes.push(d.type); });

  // Label de sección derivado del texto real de la ruta (sin la hora final),
  // así se adapta solo cuando cambie el destino en el sheet.
  function sectionLabel(list, fallback){
    const r=(list[0]&&list[0].ruta)||"";
    const stripped=r.replace(/\s*\d{1,2}\s*(am|pm)\s*$/i,"").trim();
    return stripped||fallback;
  }

  let html="<div class='tick-wrap'><div class='tick-spc'></div><div class='tick-bar-t'>";
  for(let h=MIN_H;h<=MAX_H;h+=2){
    html+=`<div class='tick-line' style='left:${pct(h)}%'><span class='tick-lbl'>${fmtH(h)}</span></div>`;
  }
  html+="</div></div>";

  function row(d){
    const pal=palette(d);
    const startP=parseFloat(pct(d.startH));
    const bSize=18;
    const minSpan=25;
    const naturalSpan=parseFloat(pct(d.startH+d.qty*1.5+0.5))-startP;
    const span=Math.max(naturalSpan,minSpan);
    const cappedStart=Math.min(startP, 98-span-8);
    let bubbles="";
    for(let i=0;i<d.qty;i++){
      const done=i<d.photos;
      const lp=cappedStart+span*(i+0.5)/d.qty;
      bubbles+=`<div class='t-bubble' style='left:${lp.toFixed(1)}%;width:${bSize}px;height:${bSize}px;background:${done?pal.accent:"transparent"};border-color:${done?pal.accent:pal.dim}'></div>`;
    }
    const label=d.truck?fmtH(d.startH)+" · #"+d.truck:fmtH(d.startH);
    return`<div class='t-row ${rowClass(d)}'><div class='t-accent' style='background:${pal.accent}'></div><div class='t-name'><div class='${nameClass(d)}'>${d.name}</div><div class='t-hour' style='color:${pal.accent}'>${label}</div></div><div class='t-count' style='color:${pal.accent}'>${d.photos}<span style='color:#666;font-weight:400;margin:0 1px'>/</span>${d.qty}</div><div class='t-bar'>${bubbles}</div></div>`;
  }

  seenTypes.forEach((type,idx)=>{
    const list=DRIVERS.filter(d=>d.type===type);
    const meta=TYPE_META[type]||{accent:"#888", label:type};
    const style=idx===0?"":" style='margin-top:10px'";
    html+=`<div class='section-lbl'${style}><div class='slbl-dot' style='background:${meta.accent}'></div><span style='color:${meta.accent}'>${sectionLabel(list,meta.label)}</span></div>`;
    list.forEach(d=>{html+=row(d);});
  });
  document.getElementById("timeline").innerHTML=html;

  const tot=DRIVERS.reduce((s,d)=>s+d.photos,0);
  const qty=DRIVERS.reduce((s,d)=>s+d.qty,0);
  const active=DRIVERS.filter(d=>d.photos>0).length;
  const doneD=DRIVERS.filter(d=>d.photos>=d.qty&&d.qty>0).length;
  const totalD=DRIVERS.filter(d=>d.qty>0).length;
  const pctC=qty>0?Math.round(tot/qty*100):0;
  const pctD=totalD>0?Math.round(doneD/totalD*100):0;
  const subCol=pctC>=75?"#00E676":pctC>=40?"#EF9F27":"#FF4081";

  document.getElementById("stats").innerHTML=`
    <div class='stat'><div class='stat-lbl'>Activos</div><div class='stat-val'>${active}</div></div>
    <div class='stat'><div class='stat-lbl'>Cargas hechas</div><div class='stat-val'>${tot}/${qty}</div><div class='stat-sub' style='color:${subCol}'>${pctC}% del día</div></div>
    <div class='stat'><div class='stat-lbl'>Faltan</div><div class='stat-val'>${qty-tot}</div></div>
    <div class='stat'><div class='stat-lbl'>Choferes listos</div><div class='stat-val'>${doneD}/${totalD}</div><div class='stat-sub' style='color:#888'>${pctD}% completaron</div></div>
  `;
}

loadData();
setInterval(loadData,REFRESH_MS);
</script>
</body>
</html>
